name: Build NumWorks

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installer la toolchain ARM
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi

      - name: Installer Node et nwlink
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installer nwlink
        run: npm install -g nwlink@1.0.0

      - name: Compiler l'app NumWorks
        run: make -f Makefile.numworks NWLINK=nwlink

      - name: Vérifier la taille (.bin)
        run: make -f Makefile.numworks check NWLINK=nwlink

      - name: Sauvegarder le .nwa
        uses: actions/upload-artifact@v4
        with:
          name: srb2-numworks
          path: |
            output/srb2.nwa
            output/srb2.bin
