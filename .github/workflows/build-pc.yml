name: Build PC (minimal)

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installer les dépendances
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential git \
            libsdl2-dev libsdl2-mixer-dev zlib1g-dev libpng-dev libcurl4-openssl-dev

      - name: Configurer (sans OpenGL, sans trace de pile)
        run: |
          cmake -B build \
            -DSRB2_CONFIG_HWRENDER=OFF \
            -DSRB2_CONFIG_EXECINFO=OFF \
            -DSRB2_CONFIG_STATIC_STDLIB=OFF

      - name: Compiler
        run: cmake --build build -j$(nproc)

      - name: Sauvegarder le binaire
        uses: actions/upload-artifact@v4
        with:
          name: srb2-pc
          path: build/bin/
